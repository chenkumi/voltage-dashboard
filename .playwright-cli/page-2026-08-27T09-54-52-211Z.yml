              - generic [ref=e51]:
                - generic [ref=e52]: 身為一個在嵌入式網站中運作的瀏覽器 WebMCP Agent，其導覽工具設計的核心理念是建立一套安全、受控且高度專業化的介面，允許 Agent 在不違反安全規範的前提下，有效地與嵌入的網頁內容進行互動和操作。這套設計體現了在自動化環境中平衡「能力」與「安全性」的設計哲學。
                - heading "一、 設計目標與核心理念" [level=3] [ref=e53]
                - generic [ref=e54]: WebMCP 的導覽工具設計主要針對**模擬購物流程（Shopping Flow Simulation）**的需求，將複雜的網頁交互分解為一系列原子化的、可控的函數調用。其核心設計目標有三點：
                - list [ref=e55]:
                  - listitem [ref=e56]:
                    - strong [ref=e57]: 功能對應性 (Functional Mapping)：
                    - text: 將實際的用戶操作（如搜尋商品、加入購物車、查看結帳）映射為特定的工具呼叫，確保 Agent 能夠執行期望的業務邏輯。
                  - listitem [ref=e58]:
                    - strong [ref=e59]: 上下文感知與限制 (Context Awareness and Limitation)：
                    - text: 工具集必須嚴格受限於嵌入頁面提供的 API，防止 Agent 嘗試進行超出其權限或安全範圍的操作，特別是涉及敏感資料的輸入和提交。
                  - listitem [ref=e60]:
                    - strong [ref=e61]: 安全優先原則 (Safety First Principle)：
                    - text: 在所有導覽步驟中，系統必須內建最高級的安全機制，確保 Agent 無法獲取、要求或洩露任何個人身份資訊（PII）或支付相關資料。
                - heading "二、 工具集的分層設計" [level=3] [ref=e62]
                - generic [ref=e63]: 我方提供的工具集（如 search_cinder_products、add_cinder_cart_item、get_cinder_checkout_preview 等）被分層設計，以精確控制 Agent 的行動範圍：
                - generic [ref=e64]:
                  - strong [ref=e65]: 1. 資訊獲取層 (Information Retrieval Layer)：
                  - text: 這類工具專注於從嵌入環境中提取靜態或動態的數據。例如，search_cinder_products 允許 Agent 根據關鍵字和分類進行篩選搜索，而 get_cinder_product 則用於獲取特定商品的詳細資訊。這層設計確保了 Agent 的決策是基於可驗證的資料。
                - generic [ref=e66]:
                  - strong [ref=e67]: 2. 狀態管理層 (State Management Layer)：
                  - text: 這類工具負責管理用戶在網站上的「狀態」，即購物車和訂單的管理。add_cinder_cart_item、update_cinder_cart_item 和 remove_cinder_cart_item 提供了對購物車內容的精確控制權，避免了直接操作網頁元素而產生的不穩定性問題。
                - generic [ref=e68]:
                  - strong [ref=e69]: 3. 流程導向層 (Process Navigation Layer)：
                  - text: 這類工具用於引導 Agent 進行關鍵的流程轉移，例如 get_cinder_checkout_preview（結帳預覽）和 open_cinder_checkout（開啟結帳頁面）。這些操作被設計為「導向」而非「執行」，明確指出最終的支付確認權仍然在用戶端。
                - heading "三、 安全與高風險操作的控制機制" [level=3] [ref=e70]
                - generic [ref=e71]: 最關鍵的設計體現於對高風險操作的限制：
                - list [ref=e72]:
                  - listitem [ref=e73]:
                    - strong [ref=e74]: 禁止提交資料：
                    - text: 任何工具（如 open_cinder_checkout）的目的都是「開啟」或「預覽」，而不是「提交」。這強制要求最終的、涉及敏感資訊的表單填寫和確認，必須由外部用戶在嵌入的網頁介面中自行完成。
                  - listitem [ref=e75]:
                    - strong [ref=e76]: 禁止資料交換：
                    - text: 系統設計明確禁止任何工具回傳或請求姓名、Email、地址、卡號或其他支付敏感數據。Agent 的交互僅限於操作商品 ID 或數量等非敏感參數。
                - generic [ref=e77]: 總而言之，WebMCP的導覽工具設計是一套高度抽象化的介面。它將複雜的網頁瀏覽任務轉化為清晰、安全、可追溯的函數呼叫序列，確保 Agent 在模擬用戶行為時，既能展現高效的導覽能力，又能嚴格遵守嵌入環境的安全邊界和資料保護規範。這使得 Agent 能夠在沙盒環境內安全地完成任務，而不對實際的金融或個人資訊構成任何風險。
